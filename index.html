const pct = (x, d = 1) => (x * 100).toFixed(d);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
let lang = "zh";

function cell(s, t) { return DATA[s] && DATA[s][t]; }

function drawChart() {
  const L = T[lang], box = document.getElementById("chart");
  box.innerHTML = "";
  const lg = document.getElementById("legend");
  lg.innerHTML = [["halogen", "Halogen"], ["gufo", "Gufo"], ["strata", "Strata"]]
    .map(([k, n]) => `<span><i style="background:var(--${k})"></i>${n}</span>`).join("") +
    `<span><i class="hollow"></i>${lang === "zh" ? "题量不完整" : "incomplete run"}</span>`;
  const LO = 0.70, HI = 1.0;
  for (const task of TASKS) {
    const rows = SETUPS.filter(s => cell(s.id, task.id) || (!s.aguard && s.id !== "halogen-v2-aguard0"));
    const p = document.createElement("div"); p.className = "panel";
    p.innerHTML = `<h3>${task.name}</h3><p class="sub">${task.metric[lang]}</p>`;
    box.appendChild(p);
    const W = 420, labelW = 0, rowH = 40, top = 6, bottom = 26, H = top + rows.length * rowH + bottom;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", role: "img", "aria-label": task.name }, p);
    const x0 = 16, x1 = W - 56;
    const X = v => x0 + (Math.max(LO, Math.min(HI, v)) - LO) / (HI - LO) * (x1 - x0);
    for (let g = LO; g <= HI + 1e-9; g += 0.05) {
      el("line", { x1: X(g), x2: X(g), y1: top, y2: H - bottom, stroke: "var(--grid)", "stroke-width": 1 }, svg);
      const tx = el("text", { x: X(g), y: H - 8, "text-anchor": "middle", "font-size": 11, fill: "var(--text-muted)" }, svg);
      tx.textContent = Math.round(g * 100) + "%";
    }
    rows.forEach((s, i) => {
      const y = top + i * rowH, cy = y + 27;
      const lab = el("text", { x: 4, y: y + 12, "font-size": 12, fill: "var(--text-secondary)" }, svg);
      lab.textContent = L.labels[s.id];
      const c = cell(s.id, task.id);
      if (!c) {
        const na = el("text", { x: X(LO) , y: cy + 4, "font-size": 12, fill: "var(--text-muted)", "font-style": "italic" }, svg);
        na.textContent = L.notrun; return;
      }
      const color = `var(--${s.engine})`, partial = s.id === "strata-ud" && task.id === "ifeval";
      el("line", { x1: X(c.acc - c.ci95), x2: X(c.acc + c.ci95), y1: cy, y2: cy, stroke: color, "stroke-width": 2, "stroke-linecap": "round", opacity: 0.55 }, svg);
      el("circle", { cx: X(c.acc), cy, r: 6, fill: partial ? "var(--bg)" : color, stroke: partial ? color : "var(--bg)", "stroke-width": partial ? 2.5 : 2 }, svg);
      const val = el("text", { x: x1 + 8, y: cy + 4, "font-size": 12, "font-weight": 600, fill: "var(--text-primary)" }, svg);
      val.textContent = pct(c.acc) + "%";
      const hit = el("rect", { x: 0, y, width: W, height: rowH, fill: "transparent", tabindex: 0 }, svg);
      const html = `<b>${L.labels[s.id]} · ${task.name}</b><br>${L.tip_acc}: ${pct(c.acc)}%<br>${L.tip_ci}: ${pct(c.acc - c.ci95)}–${pct(Math.min(1, c.acc + c.ci95))}%<br>${L.tip_n}: ${c.n.toLocaleString()}<br>${L.tip_trunc}: ${c.truncated}`;
      const show = e => { const tip = document.getElementById("tip"); tip.innerHTML = html; tip.style.opacity = 1;
        const r = e.clientX !== undefined && e.clientX ? { x: e.clientX, y: e.clientY } : (() => { const b = hit.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top }; })();
        const tw = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.x + 12)) + "px"; tip.style.top = (r.y + 14) + "px"; };
      const hide = () => document.getElementById("tip").style.opacity = 0;
      hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
      hit.addEventListener("pointerleave", hide); hit.addEventListener("focus", show); hit.addEventListener("blur", hide);
    });
  }
}

function tables() {
  const L = T[lang];
  const sw = s => `<span class="swatch" style="background:var(--${SETUPS.find(x => x.id === s).engine})"></span>`;
  // main
  let h = `<thead><tr><th>${L.th_setup}</th>${TASKS.map(t => `<th>${t.name}</th>`).join("")}</tr></thead><tbody>`;
  for (const s of SETUPS) {
    h += `<tr><td>${sw(s.id)}${L.labels[s.id]}</td>`;
    for (const t of TASKS) {
      const c = cell(s.id, t.id);
      if (!c) { h += `<td class="na">—</td>`; continue; }
      const extra = c.n !== { humaneval: 164, ifeval: 541, gsm8k: 1319, mmlu_pro: 1000 }[t.id] ? ` <span class="ci">(n=${c.n})</span>` : "";
      h += `<td>${pct(c.acc)} <span class="ci">± ${pct(c.ci95)}</span>${extra}</td>`;
    }
    h += "</tr>";
  }
  document.getElementById("main-table").innerHTML = h + "</tbody>";
  // gsm8k guard comparison (from the per-reply analysis of the two runs)
  const g = [["87.7% (1,157)", "<b>96.1%</b> (1,267)"], ["1", "1,297"], ["861", "0"], ["444", "21"]];
  document.getElementById("gsm-table").innerHTML =
    `<thead><tr><th>Halogen v2 · GSM8K · 1,319</th><th>${L.th_default}</th><th>${L.th_off}</th></tr></thead><tbody>` +
    L.gsm_rows.map((r, i) => `<tr${i === 0 ? ' class="hl"' : ""}><td>${r}</td><td>${g[i][0]}</td><td>${g[i][1]}</td></tr>`).join("") + "</tbody>";
  document.getElementById("gsm-example").textContent = lang === "zh"
    ? "# 第 7 题，标准答案 160，默认设置下的回答结尾：\n#### 160\n#### 160\n#### 160\n…（一直重复到 1,024 token）\n#### 1        ← 最后一行被截断，按 1 计分\n\n# 关闭 guard：463 token 后停在 “#### 160”，答对。"
    : "# Question 7, gold answer 160. End of the default reply:\n#### 160\n#### 160\n#### 160\n… (repeats until 1,024 tokens)\n#### 1        <- last line is cut off and scored as 1\n\n# Guard off: stops on \"#### 160\" after 463 tokens, correct.";
  // truncation
  h = `<thead><tr><th>${L.th_setup}</th>${TASKS.map(t => `<th>${t.name}</th>`).join("")}</tr></thead><tbody>`;
  for (const s of SETUPS) {
    h += `<tr><td>${sw(s.id)}${L.labels[s.id]}</td>` + TASKS.map(t => { const c = cell(s.id, t.id); return c ? `<td>${c.truncated} <span class="ci">/ ${c.n.toLocaleString()}</span></td>` : `<td class="na">—</td>`; }).join("") + "</tr>";
  }
  document.getElementById("trunc-table").innerHTML = h + "</tbody>";
  // ifeval
  const ifs = SETUPS.filter(s => cell(s.id, "ifeval"));
  const keys = ["acc", "prompt_level_loose_acc", "inst_level_strict_acc", "inst_level_loose_acc"];
  h = `<thead><tr><th></th>${ifs.map(s => `<th>${sw(s.id)}${L.labels[s.id]}${s.id === "strata-ud" ? ` <span class="ci">(${L.partial})</span>` : ""}</th>`).join("")}</tr></thead><tbody>`;
  keys.forEach((k, i) => { h += `<tr><td>${L.if_metrics[i]}</td>${ifs.map(s => `<td>${pct(cell(s.id, "ifeval")[k])}</td>`).join("")}</tr>`; });
  document.getElementById("ifeval-table").innerHTML = h + "</tbody>";
  // mmlu
  const ms = SETUPS.filter(s => cell(s.id, "mmlu_pro"));
  const cats = Object.keys(cell("halogen-v2", "mmlu_pro").by_category).sort();
  h = `<thead><tr><th></th>${ms.map(s => `<th>${sw(s.id)}${L.labels[s.id]}</th>`).join("")}</tr></thead><tbody>`;
  for (const c of cats) {
    const vals = ms.map(s => cell(s.id, "mmlu_pro").by_category[c]);
    h += `<tr><td>${L.cat ? L.cat[c] : c[0].toUpperCase() + c.slice(1)}</td>${vals.map(v => `<td>${pct(v)}</td>`).join("")}</tr>`;
  }
  h += `<tr class="hl"><td>${lang === "zh" ? "总计" : "Overall"}</td>${ms.map(s => `<td>${pct(cell(s.id, "mmlu_pro").acc)}</td>`).join("")}</tr>`;
  document.getElementById("mmlu-table").innerHTML = h + "</tbody>";
  // config
  h = `<thead><tr><th>${L.th_setup}</th><th>${L.th_engine}</th><th>${L.th_model}</th><th>${L.th_launch}</th></tr></thead><tbody>`;
  for (const r of L.cfg) h += `<tr><td>${sw(r[0])}${L.labels[r[0]]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
  document.getElementById("cfg-table").innerHTML = h + "</tbody>";
}

function setLang(l) {
  lang = l === "en" ? "en" : "zh";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = lang === "zh" ? "Qwen3.8-Flash-Next 本地引擎评测" : "Qwen3.8-Flash-Next Local Engine Evals";
  document.querySelectorAll("[data-l]").forEach(n => { n.innerHTML = T[lang][n.dataset.l]; });
  document.querySelectorAll("[data-set-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.setLang === lang));
  drawChart(); tables();
  try { localStorage.setItem("lang", lang); } catch (e) {}
}
document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.setLang)));
let init = new URLSearchParams(location.search).get("lang");
if (!init) { try { init = localStorage.getItem("lang"); } catch (e) {} }
if (!init) init = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
setLang(init);
</script>
