# One setup per line:  name | base_url | start command | stop command (optional)
# Use the same launch commands and settings as experiment 3 (Strata vs Halogen).
# The start command runs in the background; run_all.sh waits for <base_url>/models,
# runs the evals, then runs the stop command and kills the start command's process group.
# Leave the start command empty for an engine you start by hand.
#
# Fill in the real commands and ports below, then:  cp setups.example.conf setups.conf

